<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        p { font-size: 16px; opacity: 0.8; margin-bottom: 30px; }
        .link-btn {
            display: block;
            background: white;
            color: #333;
            text-decoration: none;
            padding: 15px;
            margin: 15px 0;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .link-btn:hover {
            transform: scale(1.03);
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Name</h1>
        <p>Aspiring Developer | Learning Something New Every Day</p>

        <!-- Replace the URLs below with your real links -->
        <a href="https://linkedin.com" target="_blank" class="link-btn">💼 Connect on LinkedIn</a>
        <a href="https://twitter.com" target="_blank" class="link-btn">🐦 Follow on X / Twitter</a>
        <a href="mailto:your-email@example.com" class="link-btn">✉️ Email Me</a>
    </div>
</body>
</html>
